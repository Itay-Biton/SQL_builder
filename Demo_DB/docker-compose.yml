services:
  mysql:
    image: mysql:8.0
    container_name: sqlbuilder_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sqlbuilder}
      MYSQL_USER: ${MYSQL_USER:-sqlbuilder_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_user_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-change_root_password}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
